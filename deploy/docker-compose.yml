# Magi — painel de bots L2S-43
# Bind APENAS Tailscale (100.x) e/ou loopback no HOST. NUNCA publicar em 0.0.0.0 público.
#
#   export MAGI_BIND_IP=$(tailscale ip -4)   # na Magi: 100.77.52.14
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: magi-bot-panel-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:8787}
      DATABASE_PATH: ${DATABASE_PATH:-/data/events.sqlite}
      L2S_BUS_HMAC_SECRET: ${L2S_BUS_HMAC_SECRET}
      L2S_BUS_ALLOWLIST: ${L2S_BUS_ALLOWLIST}
      MAGI_PANEL_TOKEN: ${MAGI_PANEL_TOKEN:-}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
    volumes:
      - panel-data:/data
    ports:
      - "${MAGI_BIND_IP:-127.0.0.1}:${API_PORT:-8787}:8787"
    networks:
      - panel
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://magi.tailcfeeb7.ts.net:8787}
        VITE_WS_URL: ${PUBLIC_WS_URL:-ws://magi.tailcfeeb7.ts.net:8787/v1/stream}
        VITE_USE_MOCKS: "0"
    container_name: magi-bot-panel-web
    restart: unless-stopped
    ports:
      - "${MAGI_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - panel

volumes:
  panel-data:

networks:
  panel:
    driver: bridge
